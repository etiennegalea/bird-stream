services:
  traefik:
    # v3.6+ required with Docker Engine 29 (auto-negotiates the Docker API
    # version; older traefik pins API 1.24 which Docker 29 rejects).
    image: traefik:v3.6
    container_name: traefik
    # TLS terminates at Cloudflare's edge (Zero Trust tunnel). Traefik is a
    # plain-HTTP router behind cloudflared — no ACME, no 443, no redirect.
    # Point the tunnel's ingress at http://traefik:80 (or host port 80).
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "80:80" # LAN/tunnel access; public TLS is Cloudflare's job
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped
    networks:
      - app-network

  # Cloudflare Zero Trust tunnel — uncomment to run it in this stack instead
  # of on the host. Create the tunnel in the Zero Trust dashboard, set its
  # public hostname ingress to http://traefik:80, and put the token in .env.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - traefik
  #   restart: unless-stopped
  #   networks:
  #     - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_NODE_ENV=${VITE_NODE_ENV:-production}
        # Build-time flag: rebuild the frontend after changing it in .env
        - VITE_HLS_FALLBACK=${VITE_HLS_FALLBACK:-false}
    container_name: stream-frontend
    ports:
      - "8050:80" # direct LAN access; public traffic comes through traefik
    environment:
      - CHOKIDAR_USEPOLLING=true
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: PathPrefix(`/`)
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      args:
        # true = bake ultralytics/torch into the image for bird detection
        - INSTALL_DETECTION=${INSTALL_DETECTION:-false}
    container_name: stream-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8051:8051/tcp"
      - "8051:8051/udp"
    env_file:
      - .env
    environment:
      # Bird object detection (worker runs inside the backend container)
      - DETECTION_ENABLED=${DETECTION_ENABLED:-false}
      - DETECTION_STREAM_URL=${DETECTION_STREAM_URL:-auto}
      - DETECTION_RTSP_BASE_URL=${DETECTION_RTSP_BASE_URL:-rtsp://mediamtx:8554}
      - DETECTION_MODEL=${DETECTION_MODEL:-yolo11n.pt}
      - DETECTION_MODEL_DIR=${DETECTION_MODEL_DIR:-/var/lib/birdstream/models}
      # CPU-light default: nano model, one 320px inference per second.
      - DETECTION_FPS=${DETECTION_FPS:-1}
      - DETECTION_IMGSZ=${DETECTION_IMGSZ:-320}
      - DETECTION_CONF=${DETECTION_CONF:-0.4}
      - DETECTION_CLASSES=${DETECTION_CLASSES:-bird,cat,human}
      - BIRD_LINGER_SECONDS=${BIRD_LINGER_SECONDS:-3}
      - BIRD_PRESENCE_GAP_SECONDS=${BIRD_PRESENCE_GAP_SECONDS:-1}
      - POV_CAT_PRESENCE_GAP_SECONDS=${POV_CAT_PRESENCE_GAP_SECONDS:-2}
      - POV_MONITOR_STARTUP_TIMEOUT_SECONDS=${POV_MONITOR_STARTUP_TIMEOUT_SECONDS:-15}
      - BIRD_SNAPSHOT_BORDER=${BIRD_SNAPSHOT_BORDER:-0.4}
      - BIRD_NOTIFICATION_COOLDOWN_SECONDS=${BIRD_NOTIFICATION_COOLDOWN_SECONDS:-900}
      # MQTT bridge: Pi transmitter status + start/stop from the admin panel
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_ENABLED=${MQTT_ENABLED:-true}
      # Use "-" rather than ":-" so an explicitly empty value disables
      # password auth when the mutual-TLS overlay is active.
      - MQTT_USERNAME=${MQTT_USERNAME-backend}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TLS_ENABLED=${MQTT_TLS_ENABLED:-false}
      - MQTT_TLS_CA_CERT=${MQTT_TLS_CA_CERT:-/run/secrets/mqtt/ca.crt}
      - MQTT_TLS_CLIENT_CERT=${MQTT_TLS_CLIENT_CERT:-/run/secrets/mqtt/client.crt}
      - MQTT_TLS_CLIENT_KEY=${MQTT_TLS_CLIENT_KEY:-/run/secrets/mqtt/client.key}
    volumes:
      - ./backend:/app
      # Persistent writable cache for YOLO weights. /app can be read-only to
      # the container user when bind-mounted from the Proxmox host.
      - detection_models:/var/lib/birdstream/models
    labels:
      traefik.enable: "true"
      # /api/* -> backend (prefix stripped). Longer rules win in traefik, so
      # /api/mediamtx below shadows this one without explicit priorities.
      traefik.http.routers.api.rule: PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api.middlewares: api-strip
      traefik.http.middlewares.api-strip.stripprefix.prefixes: /api
      traefik.http.services.api.loadbalancer.server.port: "8051"
      # Block the MediaMTX auth hook at the edge entirely — MediaMTX calls
      # the backend directly on the docker network, never via traefik. Behind
      # the Cloudflare tunnel every request has a private source IP, so an
      # IP allowlist can't distinguish public traffic; deny all instead.
      traefik.http.routers.api-mediamtx.rule: PathPrefix(`/api/mediamtx`)
      traefik.http.routers.api-mediamtx.entrypoints: web
      traefik.http.routers.api-mediamtx.middlewares: deny-all
      traefik.http.routers.api-mediamtx.service: api
      traefik.http.middlewares.deny-all.ipallowlist.sourcerange: 255.255.255.255/32
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-birb_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mediamtx:
    image: bluenviron/mediamtx:1.13.0
    container_name: mediamtx
    ports:
      - "8890:8890/udp" # SRT ingest (Pi publishes here)
      - "8889:8889/tcp" # WebRTC / WHEP
      - "8189:8189/udp" # WebRTC ICE (UDP mux)
      - "8888:8888/tcp" # HLS
      # RTSP for host-networked backend (aiortc VIDEO_SOURCE + detection).
      # Loopback-only: NOT reachable from the LAN or internet.
      - "127.0.0.1:8554:8554/tcp"
    volumes:
      - type: bind
        source: ./mediamtx/mediamtx.yml
        target: /mediamtx.yml
        read_only: true
        # Fail clearly when configuration has not been generated. Short bind
        # syntax otherwise creates a directory at the missing source path.
        bind:
          create_host_path: false
    environment:
      # Overrides webrtcAdditionalHosts in mediamtx.yml. Comma-separated:
      # public IP (or grey-cloud DNS name) + LAN IP. Set in .env.
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_PUBLIC_HOSTS:?set WEBRTC_PUBLIC_HOSTS in .env}
    depends_on:
      - backend
    labels:
      traefik.enable: "true"
      # WHEP signaling + built-in player at https://<domain>/birdcam
      # (WebRTC media itself still flows over UDP 8189 / coturn.)
      traefik.http.routers.whep.rule: PathPrefix(`/birdcam`)
      traefik.http.routers.whep.entrypoints: web
      traefik.http.routers.whep.service: whep
      traefik.http.services.whep.loadbalancer.server.port: "8889"
      # HLS (plain HTTP -> works through the Cloudflare tunnel, ~2-6s latency)
      # Player URL: https://<domain>/hls/birdcam/index.m3u8
      traefik.http.routers.hls.rule: PathPrefix(`/hls`)
      traefik.http.routers.hls.entrypoints: web
      traefik.http.routers.hls.middlewares: hls-strip
      traefik.http.middlewares.hls-strip.stripprefix.prefixes: /hls
      traefik.http.routers.hls.service: hls
      traefik.http.services.hls.loadbalancer.server.port: "8888"
    restart: unless-stopped
    networks:
      - app-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883/tcp"
      - "8883:8883/tcp" # active after enabling the mTLS reference config
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - app-network

  # coturn removed: WHEP serves media directly from MediaMTX (one forwarded
  # UDP port, 8189) — TURN is only needed when the server itself is
  # unreachable. Restore from git history if the aiortc path is revived.

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  detection_models:
