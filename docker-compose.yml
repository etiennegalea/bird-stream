services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_NODE_ENV=${VITE_NODE_ENV:-production}
        - VITE_OPENRELAY_TURN_USERNAME=${VITE_OPENRELAY_TURN_USERNAME}
        - VITE_OPENRELAY_TURN_CREDENTIAL=${VITE_OPENRELAY_TURN_CREDENTIAL}
    container_name: stream-frontend
    ports:
      - "8050:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      args:
        # true = bake ultralytics/torch into the image for bird detection
        - INSTALL_DETECTION=${INSTALL_DETECTION:-false}
    container_name: stream-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8051:8051/tcp"
      - "8051:8051/udp"
    env_file:
      - .env
    environment:
      # Bird object detection (worker runs inside the backend container)
      - DETECTION_ENABLED=${DETECTION_ENABLED:-false}
      - DETECTION_STREAM_URL=${DETECTION_STREAM_URL:-rtsp://mediamtx:8554/birdcam}
      - DETECTION_MODEL=${DETECTION_MODEL:-yolo11n.pt}
      - DETECTION_FPS=${DETECTION_FPS:-2}
      - DETECTION_CONF=${DETECTION_CONF:-0.4}
      - DETECTION_CLASSES=${DETECTION_CLASSES:-bird}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=birb_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mediamtx:
    image: bluenviron/mediamtx:1.13.0
    container_name: mediamtx
    ports:
      - "8890:8890/udp" # SRT ingest (Pi publishes here)
      - "8889:8889/tcp" # WebRTC / WHEP
      - "8189:8189/udp" # WebRTC ICE (UDP mux)
      - "8888:8888/tcp" # HLS
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883/tcp"
      # - "8883:8883/tcp" # TLS listener (enable in mosquitto.conf first)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - app-network

  coturn:
    build: ./coturn
    container_name: coturn
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf
      - ./coturn/certs:/etc/coturn/certs
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "turnutils_stunclient", "localhost", "3478" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
