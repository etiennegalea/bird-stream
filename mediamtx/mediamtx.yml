# MediaMTX — media plane for Birdstream.
# SRT in from the Pi → WHEP (WebRTC) + HLS out to browsers, no transcoding.

logLevel: info

# Control API — used by the backend to count viewers (peer-count).
# Port 9997 is NOT published in docker-compose; docker-network only.
api: yes
apiAddress: :9997

# All publish/read requests are authorized by the backend.
authMethod: http
authHTTPAddress: http://backend:8051/mediamtx/auth

# ── RTSP (INTERNAL ONLY — for the backend detection worker) ─────────────
# Port 8554 is intentionally NOT published in docker-compose; the auth hook
# allows rtsp reads unconditionally on that assumption. Do not expose it.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: no

# ── SRT ingest (Pi publishes here) ────────────────────────────────────────
# Pi streamid: publish:birdcam:<user>:<pass>
srt: yes
srtAddress: :8890

# ── WebRTC / WHEP output (sub-second latency) ────────────────────────────
# Player URL: http://<host>:8889/birdcam/whep
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
# Public IP advertised in ICE candidates (requires 8189/udp forwarded).
# NOTE: do NOT use a Cloudflare-proxied (orange-cloud) domain here — it
# resolves to Cloudflare edge IPs which can't carry WebRTC media. Use the
# raw public IP, or a DNS-only (grey-cloud) subdomain pointing at it.
# Public IP (internet viewers, needs 8189/udp forwarded) + LAN IP (viewers
# on the home network, where hairpin NAT to the public IP often fails).
webrtcAdditionalHosts: [89.98.230.28, 192.168.178.24]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  # Your coturn (uncomment + fill from .env):
  # - url: turn:turn.lifeofarobin.com:3478
  #   username: <turn-user>
  #   password: <turn-credential>

# ── HLS output (scalable fallback, ~2-6s latency) ────────────────────────
# Player URL: http://<host>:8888/birdcam/index.m3u8
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s

paths:
  birdcam:
    source: publisher   # only an authorized SRT publisher may feed this path
