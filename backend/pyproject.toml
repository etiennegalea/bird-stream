[project]
name = "bird-stream-backend"
version = "0.1.0"
description = "WebRTC bird streaming backend"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]>=2.12",
    "uvicorn>=0.30",
    "opencv-python-headless>=4.13",
    "av>=12.0.0",
    "aiortc>=1.8.0",
    "aiohttp>=3.8.6",
    "websockets>=12.0",
    "pytz",
    "opencv-python-headless>=4.13",
    "numpy>=2.1",
    "requests",
    "pyyaml",
    "msgspec>=0.19.0",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.50",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.6.0",
    "paho-mqtt>=1.6.1",
    "pyjwt>=2.13.0",
]

[dependency-groups]
# Bird object detection (DETECTION_ENABLED=true). Optional: pulls in torch CPU.
# Install with: uv sync --group detection
# In Docker: build with --build-arg INSTALL_DETECTION=true
# torch/torchvision are pinned to the CPU-only index below — the default PyPI
# wheels drag in the full NVIDIA CUDA runtime (several GB), useless on a
# GPU-less host and it overflowed the image/disk during the build.
detection = [
    "ultralytics>=8.3",
    "torch",
    "torchvision",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
    "python-dotenv>=1.2.2",
    "typer>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false

# Pull PyTorch from its CPU-only wheel index. Default PyPI torch wheels bundle
# the NVIDIA CUDA runtime (nvidia-cu13-*, multiple GB) which a GPU-less server
# can't use — and which filled the disk during the detection image build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
