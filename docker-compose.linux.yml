# Linux production overrides.
#
# Since the switch to WHEP/HLS (served by MediaMTX), the backend no longer
# terminates WebRTC media, so host networking and coturn are gone — the base
# compose file works as-is on Linux. This override only tunes networking.
#
# If you ever revive the legacy aiortc path (AIORTC_ENABLED=true), restore
# the host-networking overrides for backend/coturn from git history and
# re-mount traefik/hostnet-api.yml into traefik's dynamic config dir.

networks:
  app-network:
    enable_ipv6: true
