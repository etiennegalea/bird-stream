# Traefik file-provider route for Linux deployments (docker-compose.linux.yml)
# where the backend runs with network_mode: host and therefore has no bridge
# IP for the docker provider to discover. Mounted into /etc/traefik/dynamic/
# by the linux override only — not loaded on the default bridge setup.

http:
  routers:
    api-hostnet:
      rule: PathPrefix(`/api`)
      entryPoints: [web]
      middlewares: [api-strip-hostnet]
      service: api-hostnet
    api-mediamtx-hostnet:
      rule: PathPrefix(`/api/mediamtx`)
      entryPoints: [web]
      middlewares: [deny-all-hostnet, api-strip-hostnet]
      service: api-hostnet

  middlewares:
    api-strip-hostnet:
      stripPrefix:
        prefixes: [/api]
    # Hard deny: behind the Cloudflare tunnel all requests have private
    # source IPs, so allowlisting private ranges would admit everyone.
    deny-all-hostnet:
      ipAllowList:
        sourceRange: [255.255.255.255/32]

  services:
    api-hostnet:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8051
